name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 校验 tag 版本与代码/安装程序一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $Tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $App = (Select-String -Path micast\__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $Iss = (Select-String -Path packaging\windows\MiCast.iss -Pattern '#define\s+AppVersion\s+"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "tag=$Tag app=$App iss=$Iss"
          if ($Tag -ne $App) { throw "tag 版本与 micast/__init__.py 的 __version__ 不一致" }
          if ($Tag -ne $Iss) { throw "tag 版本与 MiCast.iss 的 AppVersion 不一致" }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Python deps
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Resolve package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            "MICAST_VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_ENV
          }

      - name: Build portable and installed editions
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-windows-distributions.ps1

      - name: Smoke test the exe
        run: |
          $env:MICAST_NO_DESKTOP = '1'
          $env:MICAST_HOST = '127.0.0.1'
          $env:MICAST_PORT = '42300'
          $env:MICAST_DATA_DIR = Join-Path $env:RUNNER_TEMP 'micast-smoke-data'
          $env:MICAST_LOG_DIR = Join-Path $env:RUNNER_TEMP 'micast-smoke-logs'
          $p = Start-Process .\dist\MiCast.exe -PassThru -WindowStyle Hidden
          $ok = $false
          try {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep 2
              if ($p.HasExited) { break }
              try {
                Invoke-RestMethod http://127.0.0.1:42300/health -TimeoutSec 2 | Out-Null
                $ok = $true; break
              } catch {}
            }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          if (-not $ok) {
            Get-ChildItem $env:MICAST_LOG_DIR -Filter '*.log' -ErrorAction SilentlyContinue |
              ForEach-Object { Get-Content $_.FullName -Tail 100 }
            throw "MiCast.exe did not answer /health during the startup check"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: MiCast-windows
          path: |
            dist/MiCast-Portable.zip
            dist/installer/MiCast-Setup.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/MiCast-Portable.zip
            dist/installer/MiCast-Setup.exe
