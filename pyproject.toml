[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "micast"
version = "0.3.3"
description = "把手机、电脑上的音频投放到一台或多台小米智能音箱。支持跨型号组播、多音箱同步和立体声组合，通过 AirPlay / DLNA 即连即播。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "DyMode" },
]
# Runtime dependencies are duplicated in requirements.txt (Docker/fnOS builds
# consume that file); keep the two in sync. requirements.txt is authoritative.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    # Lower bound is the version whose aiohttp-based MiAccount the 15s command
    # timeout wrapper assumes; older forks may run a different HTTP stack.
    "miservice-fork>=2.9.3",
    "qrcode>=7.4",
    "pillow>=10.3",
    "aiofiles>=23.2",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "av>=18.0",
    "numpy>=2.0",
    "pycryptodome>=3.20",
    "zeroconf>=0.140",
]

[project.optional-dependencies]
# Packaged desktop app only (PyInstaller builds) — Docker/NAS images skip these.
desktop = [
    "pywebview>=5.0",
    "pystray>=0.19",
    "pywin32>=306; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "docker>=7.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long expected-payload literals in tests read better unwrapped.
"tests/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "audio: codec and timed audio delivery suites",
    "packaging: distribution and installation artifact contracts",
]
